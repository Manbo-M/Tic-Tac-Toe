<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Tic-Tac-Toe</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Retro Pixel Font (Press Start 2P) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Press Start 2P', cursive, monospace;
      background-color: #121318;
      color: #f3f4f6;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 画像用ピクセルレンダー設定 */
    img, .pixel-img {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
    }

    /* Oマーカー（黒背景＋白丸）: mix-blend-mode: screen で黒背景を透明化して緑盤面になじませる */
    .marker-o {
      mix-blend-mode: screen;
      filter: contrast(1.2);
    }

    /* Xマーカー（白背景＋黒バツ）: mix-blend-mode: multiply で白背景を透明化して緑盤面になじませる */
    .marker-x {
      mix-blend-mode: multiply;
      filter: contrast(1.2);
    }

    /* レトロピクセルボタンのスタイル */
    .pixel-btn {
      position: relative;
      background-color: #3b82f6;
      color: #ffffff;
      border: 4px solid #1d4ed8;
      box-shadow: inset -4px -4px 0px 0px #1e40af, inset 4px 4px 0px 0px #60a5fa;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }
    .pixel-btn:hover {
      background-color: #60a5fa;
      transform: translateY(-2px);
    }
    .pixel-btn:active {
      transform: translateY(2px);
      box-shadow: inset 2px 2px 0px 0px #1e40af;
    }

    .pixel-btn-green {
      background-color: #10b981;
      border-color: #047857;
      box-shadow: inset -4px -4px 0px 0px #065f46, inset 4px 4px 0px 0px #34d399;
    }
    .pixel-btn-green:hover { background-color: #34d399; }

    .pixel-btn-red {
      background-color: #ef4444;
      border-color: #b91c1c;
      box-shadow: inset -4px -4px 0px 0px #991b1b, inset 4px 4px 0px 0px #f87171;
    }
    .pixel-btn-red:hover { background-color: #f87171; }

    /* レトロ枠線ボックス */
    .pixel-box {
      background-color: #232635;
      border: 4px solid #4b5563;
      box-shadow: inset -4px -4px 0px 0px #111827, inset 4px 4px 0px 0px #6b7280, 0 8px 20px rgba(0,0,0,0.6);
    }

    /* セルのホバー・タップ効果 */
    .board-cell {
      cursor: pointer;
      position: relative;
      transition: filter 0.1s ease;
    }
    .board-cell:hover {
      filter: brightness(1.15);
    }
    .board-cell:active {
      filter: brightness(0.9);
    }

    /* 勝利ライン点滅エフェクト */
    @keyframes pixel-flash {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.8) drop-shadow(0 0 6px #fef08a); }
    }
    .winning-cell {
      animation: pixel-flash 0.5s infinite ease-in-out;
      z-index: 10;
    }

    /* モード選択タブのアクティブ状態 */
    .tab-active {
      background-color: #f59e0b !important;
      border-color: #b45309 !important;
      box-shadow: inset -4px -4px 0px 0px #78350f, inset 4px 4px 0px 0px #fbbf24 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

  <div class="pixel-box w-full max-w-md p-4 sm:p-6 flex flex-col items-center gap-4 rounded-lg">
    
    <!-- タイトルヘッダー -->
    <div class="text-center w-full">
      <h1 class="text-xl sm:text-2xl font-bold text-yellow-400 tracking-wider mb-1 drop-shadow-[0_3px_0_#92400e]">
        TIC-TAC-TOE
      </h1>
      <p class="text-[10px] sm:text-xs text-gray-400">まるバツゲーム</p>
    </div>

    <!-- ゲームモード切り替えボタン -->
    <div class="flex w-full justify-center gap-1.5 text-[9px] sm:text-xs">
      <button id="mode-pvp" class="pixel-btn tab-active px-2.5 py-2 flex-1 text-center">
        👥 2P対戦
      </button>
      <button id="mode-cpu-easy" class="pixel-btn px-2.5 py-2 flex-1 text-center">
        🤖 CPU (易)
      </button>
      <button id="mode-cpu-hard" class="pixel-btn px-2.5 py-2 flex-1 text-center">
        🧠 CPU (強)
      </button>
    </div>

    <!-- ターン/ステータス表示 -->
    <div class="w-full bg-gray-900 border-2 border-gray-700 p-2.5 flex justify-between items-center text-xs">
      <div id="status-display" class="flex items-center gap-2">
        <span>TURN:</span>
        <div id="turn-icon-container" class="w-6 h-6 flex items-center justify-center">
          <!-- 現在のターンの画像アイコンが入ります -->
        </div>
      </div>
      <button id="sound-toggle" class="text-gray-400 hover:text-white text-xs focus:outline-none">
        🔊 ON
      </button>
    </div>

    <!-- 盤面コンテナ (背景画像: pixel_art_48x48 (4).png) -->
    <div class="relative p-2 bg-[#1b400b] border-4 border-[#0e2406] shadow-2xl rounded-sm">
      <!-- 盤面全体の背景として指定の9マスチェッカー画像を使用 -->
      <div 
        id="board-bg" 
        class="relative w-[280px] h-[280px] sm:w-[320px] sm:h-[320px] bg-cover bg-center grid grid-cols-3 grid-rows-3"
        style="background-image: url('bord.png'); image-rendering: pixelated;"
      >
        <!-- JSで9つのセルを動的生成 -->
      </div>
    </div>

    <!-- スコア表示 -->
    <div class="w-full grid grid-cols-3 gap-2 text-center text-[10px] sm:text-xs bg-gray-900/90 p-2 border border-gray-700">
      <div class="flex flex-col items-center">
        <span class="text-gray-300 mb-1 flex items-center gap-1">
          <img src="maru.png" alt="O" class="w-4 h-4 marker-o inline" />
          (◯)
        </span>
        <span id="score-o" class="text-green-400 font-bold text-sm">0</span>
      </div>
      <div class="flex flex-col items-center border-x border-gray-700">
        <span class="text-gray-400 mb-1">DRAW</span>
        <span id="score-draw" class="text-gray-300 font-bold text-sm">0</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-gray-300 mb-1 flex items-center gap-1">
          <img src="batu.png" alt="X" class="w-4 h-4 marker-x inline" />
          (✕)
        </span>
        <span id="score-x" class="text-red-400 font-bold text-sm">0</span>
      </div>
    </div>

    <!-- コントロールボタン -->
    <div class="flex w-full gap-2">
      <button id="reset-btn" class="pixel-btn pixel-btn-green w-full py-2.5 text-xs tracking-wide">
        🔄 もういちど
      </button>
      <button id="clear-score-btn" class="pixel-btn pixel-btn-red py-2.5 px-3 text-xs shrink-0" title="スコアクリア">
        🗑️
      </button>
    </div>

  </div>

  <script>
    // --- 画像パスの設定 (ユーザー指定のファイル名) ---
    const IMG_BG = "bord.png"; // 盤面背景
    const IMG_O  = "maru.png"; // 丸マーカー (白丸/黒背景)
    const IMG_X  = "batu.png"; // バツマーカー (黒バツ/白背景)

    // --- Web Audio API 効果音エンジン ---
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playTone(freq, type, duration, volume = 0.1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error(e);
        }
      }

      playPlaceSound(player) {
        if (player === 'O') {
          this.playTone(523.25, 'square', 0.08, 0.12); // C5
          setTimeout(() => this.playTone(659.25, 'square', 0.1, 0.12), 40); // E5
        } else {
          this.playTone(400, 'square', 0.08, 0.12);
          setTimeout(() => this.playTone(300, 'square', 0.1, 0.12), 40);
        }
      }

      playWinSound() {
        if (!this.enabled) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.15), i * 90);
        });
      }

      playDrawSound() {
        if (!this.enabled) return;
        const notes = [380, 340, 300, 260];
        notes.forEach((freq, i) => {
          setTimeout(() => this.playTone(freq, 'sawtooth', 0.15, 0.1), i * 80);
        });
      }
    }

    const sound = new RetroAudio();

    // --- ゲーム状態変数 ---
    let boardState = Array(9).fill(null);
    let currentPlayer = 'O';
    let gameActive = true;
    let gameMode = 'pvp'; // 'pvp', 'cpu-easy', 'cpu-hard'
    let scores = { O: 0, X: 0, draw: 0 };

    const WINNING_COMBOS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // 横
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // 縦
      [0, 4, 8], [2, 4, 6]             // 斜め
    ];

    // DOM Elements
    const boardBg = document.getElementById('board-bg');
    const turnIconContainer = document.getElementById('turn-icon-container');
    const scoreOEl = document.getElementById('score-o');
    const scoreXEl = document.getElementById('score-x');
    const scoreDrawEl = document.getElementById('score-draw');
    const resetBtn = document.getElementById('reset-btn');
    const clearScoreBtn = document.getElementById('clear-score-btn');
    const soundToggleBtn = document.getElementById('sound-toggle');

    const modePvPBtn = document.getElementById('mode-pvp');
    const modeCpuEasyBtn = document.getElementById('mode-cpu-easy');
    const modeCpuHardBtn = document.getElementById('mode-cpu-hard');

    // --- 盤面初期化 ---
    function initBoard() {
      boardBg.innerHTML = '';
      boardState = Array(9).fill(null);
      gameActive = true;

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'board-cell flex items-center justify-center w-full h-full p-2';
        cell.dataset.index = i;
        cell.addEventListener('click', () => handleCellClick(i));
        boardBg.appendChild(cell);
      }

      currentPlayer = 'O';
      updateTurnDisplay();
    }

    // ターン表示の更新
    function updateTurnDisplay() {
      turnIconContainer.innerHTML = '';
      const img = document.createElement('img');
      img.src = currentPlayer === 'O' ? IMG_O : IMG_X;
      img.className = `w-full h-full object-contain ${currentPlayer === 'O' ? 'marker-o' : 'marker-x'}`;
      turnIconContainer.appendChild(img);
    }

    // セルクリック時の処理
    function handleCellClick(index) {
      if (!gameActive || boardState[index] !== null) return;

      makeMove(index, currentPlayer);

      // CPU対戦モードかつゲームが継続中の場合
      if (gameActive && gameMode.startsWith('cpu') && currentPlayer === 'X') {
        gameActive = false; // CPU思考中のタップ無効化
        setTimeout(() => {
          gameActive = true;
          let cpuMove = gameMode === 'cpu-easy' ? getRandomMove() : getBestMove();
          if (cpuMove !== null) {
            makeMove(cpuMove, 'X');
          }
        }, 400);
      }
    }

    // コマを配置する処理
    function makeMove(index, player) {
      boardState[index] = player;
      const cell = boardBg.children[index];

      // 指定画像を挿入（クラス名でブレンドモード適用）
      const img = document.createElement('img');
      img.src = player === 'O' ? IMG_O : IMG_X;
      img.alt = player;
      img.className = `w-full h-full object-contain ${player === 'O' ? 'marker-o' : 'marker-x'}`;
      cell.appendChild(img);

      sound.playPlaceSound(player);

      const winCombo = checkWin(player);
      if (winCombo) {
        handleWin(player, winCombo);
        return;
      }

      if (boardState.every(c => c !== null)) {
        handleDraw();
        return;
      }

      // ターン交代
      currentPlayer = currentPlayer === 'O' ? 'X' : 'O';
      updateTurnDisplay();
    }

    // 勝利判定
    function checkWin(player) {
      return WINNING_COMBOS.find(combo => {
        return combo.every(idx => boardState[idx] === player);
      });
    }

    // 勝利時の処理
    function handleWin(player, combo) {
      gameActive = false;
      scores[player]++;
      updateScores();
      sound.playWinSound();

      // 勝利マスのエフェクト
      combo.forEach(idx => {
        boardBg.children[idx].classList.add('winning-cell');
      });
    }

    // 引き分け時の処理
    function handleDraw() {
      gameActive = false;
      scores.draw++;
      updateScores();
      sound.playDrawSound();
    }

    function updateScores() {
      scoreOEl.textContent = scores.O;
      scoreXEl.textContent = scores.X;
      scoreDrawEl.textContent = scores.draw;
    }

    // --- CPU AI ロジック ---
    function getRandomMove() {
      const emptyIndices = boardState
        .map((val, idx) => val === null ? idx : null)
        .filter(val => val !== null);
      if (emptyIndices.length === 0) return null;
      return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    }

    // Minimax (最強CPU)
    function getBestMove() {
      let bestScore = -Infinity;
      let move = null;

      for (let i = 0; i < 9; i++) {
        if (boardState[i] === null) {
          boardState[i] = 'X';
          let score = minimax(boardState, 0, false);
          boardState[i] = null;
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move !== null ? move : getRandomMove();
    }

    function minimax(board, depth, isMaximizing) {
      if (checkWinForBoard(board, 'X')) return 10 - depth;
      if (checkWinForBoard(board, 'O')) return depth - 10;
      if (board.every(cell => cell !== null)) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === null) {
            board[i] = 'X';
            let score = minimax(board, depth + 1, false);
            board[i] = null;
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === null) {
            board[i] = 'O';
            let score = minimax(board, depth + 1, true);
            board[i] = null;
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }

    function checkWinForBoard(board, player) {
      return WINNING_COMBOS.some(combo => combo.every(i => board[i] === player));
    }

    // --- イベントリスナー設定 ---
    function setMode(mode, activeBtn) {
      gameMode = mode;
      [modePvPBtn, modeCpuEasyBtn, modeCpuHardBtn].forEach(btn => btn.classList.remove('tab-active'));
      activeBtn.classList.add('tab-active');
      initBoard();
    }

    modePvPBtn.addEventListener('click', () => setMode('pvp', modePvPBtn));
    modeCpuEasyBtn.addEventListener('click', () => setMode('cpu-easy', modeCpuEasyBtn));
    modeCpuHardBtn.addEventListener('click', () => setMode('cpu-hard', modeCpuHardBtn));

    resetBtn.addEventListener('click', () => initBoard());

    clearScoreBtn.addEventListener('click', () => {
      scores = { O: 0, X: 0, draw: 0 };
      updateScores();
      initBoard();
    });

    soundToggleBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      soundToggleBtn.textContent = sound.enabled ? '🔊 ON' : '🔇 OFF';
      soundToggleBtn.classList.toggle('text-gray-500', !sound.enabled);
      soundToggleBtn.classList.toggle('text-gray-400', sound.enabled);
    });

    // 初期化実行
    window.onload = () => {
      initBoard();
    };
  </script>
</body>
</html>
